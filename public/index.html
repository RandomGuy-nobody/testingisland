<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Epstein island</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="/socket.io/socket.io.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="vignette"></div>

  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="stats">
      <div class="stat"><span class="label">PLAYERS</span><span id="players">1</span></div>
      <div class="stat"><span class="label">EPSTEIN</span><span id="dist">--</span></div>
    </div>
    <div id="warning">IT SEES YOU</div>
    <div id="hint">click to lock mouse</div>
  </div>

  <div id="menu">
    <div class="panel">
      <h1>EPSTEIN<span>ISLAND</span></h1>
      <p class="tag">A nextbot stalks the island. Run. Jump. Survive.</p>
      <input id="name" maxlength="14" placeholder="your name" autocomplete="off" />
      <button id="play">ENTER THE ISLAND</button>
      <div class="controls">
        <span><b>WASD</b> move</span>
        <span><b>SHIFT</b> sprint</span>
        <span><b>SPACE</b> jump</span>
        <span><b>ESC</b> release mouse</span>
      </div>
      <div id="loading">connecting…</div>
    </div>
  </div>

  <div id="caught">
    <img id="caught-img" alt="" />
    <div id="caught-text">CAUGHT</div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
